<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RELAY 订单异常处理台 · AI 工作台 — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* finesse · register=product · sub=ai-console · A=oat-paper+brick/olive-two-tone
   * B=Manrope-800/400 + PlexMono · C=three-column-console(rail|stream|aside)
   * D=none(feedback-only motion) · E=工单流水台与回执
   * SOUL=6 SPECTACLE=2 DENSITY=8
   *
   * 语料库参考页 —— ai-console.md 的桌面形态。要读的东西，按章节号：
   *   §1    三时态同屏：左栏 = 队列(未来) + 历史(过去)，中栏 = 正在跑的这一条(现在)
   *   §2    run stream 取代图表当主角：一步一行，折叠可读，展开是证据(入参/出参/耗时)
   *   §3    九种运行态全部渲染 —— 尤其 partial(跳过 4 单) 和 stopped，
   *         这两个是别人不做而用户最需要的
   *   §4    停止键常驻：不悬停不藏菜单，按下当帧就改状态并说出死在第几步
   *   §5    审批卡长在流里而不是弹窗：要做什么 / 影响什么 / 凭什么(可点) / 三个动作
   *   §6    成本是回执行 + 有界预算条，不是设置页里的数字
   *   §7    产物面板带「回到生成它的那一步」
   *   §8    三栏壳 + product-palettes.md §4.A 双色壳(深色轨 + 浅色内容)
   *   §10   颜色先分「它自己干完的」(橄榄) 和「在等你」(砖红)，砖红更响；
   *         整页只有一处持续动画 = 当前步的心跳点
   *
   * 配色 = product-palettes.md Set 7「Brick & Olive」，--bg 按 craft floor 往页面色相
   * 上调了几个点，不用纯白。零图片：头像是字母块，产物是真表格。 */
  :root{
    --page:#f3efe6; --bg:#fdfbf6; --panel-2:#f9f6ef;
    --border:rgba(44,30,22,.08); --border-2:rgba(44,30,22,.15);
    --ink-1:#1e1712; --ink-2:#4a3e35; --ink-3:#7f7263; --ink-4:#a2957f;
    /* §10 的语义对：needs 比 auto 响 */
    --needs:#9C4A38; --auto:#5C5A3A;
    --needs-soft:rgba(156,74,56,.10); --auto-soft:rgba(92,90,58,.12);
    --on-accent:#fffdf8;
    --up:#3E7A52; --down:#C22E22; --warn:#B77A16;
    --warn-soft:rgba(183,122,22,.13); --down-soft:rgba(194,46,34,.11);
    --rail:#141210; --rail-2:#1f1b16; --rail-3:#2a251e;
    --rail-ink:#a89c8e; --rail-ink-2:#6f665b; --rail-ink-on:#fdfbf6;
    --rail-border:rgba(255,255,255,.07);
    --shadow:0 1px 3px rgba(56,36,24,.05);
    --shadow-lg:0 30px 70px -46px rgba(56,36,24,.5);
    --r:14px; --r-sm:10px; --r-xs:7px;
    --nav-h:60px;
    --ease:cubic-bezier(.22,.9,.28,1);
    --sans:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:clip}
  body{
    background:var(--page);color:var(--ink-1);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--needs);color:var(--on-accent)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--needs);outline-offset:2px;border-radius:4px}

  .app{display:grid;grid-template-columns:276px minmax(0,1fr) 344px;height:100vh}

  /* ── 左轨：队列(未来) + 历史(过去) ───────────────────────────
     深色轨来自 product-palettes.md §4.A，色相跟着暖页面走，不是冷蓝黑 */
  .rail{
    background:var(--rail);color:var(--rail-ink);
    display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--rail-border);
  }
  .brand{
    display:flex;align-items:center;gap:10px;height:var(--nav-h);flex:none;
    padding:0 18px;border-bottom:1px solid var(--rail-border);
  }
  .brand .mk{
    width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--needs);color:var(--on-accent);font-weight:800;font-size:13px;letter-spacing:-.03em;
  }
  .brand b{color:var(--rail-ink-on);font-size:15px;font-weight:800;letter-spacing:-.01em}
  .brand span{font-size:11px;color:var(--rail-ink-2);margin-left:auto;font-family:var(--mono)}

  .rail-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 10px}
  .rail-scroll::-webkit-scrollbar{width:6px}
  .rail-scroll::-webkit-scrollbar-thumb{background:var(--rail-3);border-radius:99px}
  .grp{
    display:flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rail-ink-2);padding:16px 8px 8px;font-weight:600;line-height:1.2;
  }
  .grp .c{
    margin-left:auto;letter-spacing:0;font-family:var(--mono);font-size:11px;
    background:var(--rail-2);padding:1px 6px;border-radius:99px;
  }

  .qrow{
    position:relative;width:100%;text-align:left;display:block;
    padding:10px 11px 11px 26px;border-radius:var(--r-sm);
    transition:background .18s ease;
  }
  .qrow:hover{background:var(--rail-2)}
  .qrow.on{background:var(--rail-2)}
  /* 选中态用伪元素做左标，不用 border-left —— 侧边彩条边框是 anti-cheap 的老 tell */
  .qrow.on::after{
    content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:var(--needs);
  }
  .qrow .dot{
    position:absolute;left:11px;top:16px;width:7px;height:7px;border-radius:50%;
    background:var(--rail-ink-2);
  }
  .qrow .ttl{
    display:flex;align-items:baseline;gap:7px;color:var(--rail-ink-on);
    font-size:13px;font-weight:600;letter-spacing:-.01em;
  }
  .qrow.done .ttl{color:var(--rail-ink);font-weight:500}
  .qrow .id{font-family:var(--mono);font-size:10.5px;color:var(--rail-ink-2);font-weight:400}
  .qrow .meta{font-size:11.5px;color:var(--rail-ink-2);margin-top:3px;display:flex;gap:6px;align-items:center}
  .qrow .meta .st{font-weight:600}

  .rail-me{
    flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-top:1px solid var(--rail-border);
  }
  .rail-me .av{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--auto);color:var(--on-accent);font-size:11px;font-weight:700;
  }
  .rail-me .nm{font-size:12.5px;color:var(--rail-ink-on);font-weight:600}
  .rail-me .rl{font-size:11px;color:var(--rail-ink-2)}

  /* ── 中栏：run stream(现在) ─────────────────────────────── */
  .stream-col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .runhead{
    flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;height:var(--nav-h);
    border-bottom:1px solid var(--border);background:var(--bg);
  }
  .runhead h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .runhead .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-size:11.5px;font-weight:600;line-height:1.3;
  }
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.needs{background:var(--needs-soft);color:var(--needs)}
  .chip.auto{background:var(--auto-soft);color:var(--auto)}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.down{background:var(--down-soft);color:var(--down)}
  .chip.mute{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--border)}
  .runhead .right{margin-left:auto;display:flex;align-items:center;gap:9px}

  .stream{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 8px;scroll-behavior:smooth}
  .stream::-webkit-scrollbar{width:8px}
  .stream::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
  .runbar{
    display:flex;align-items:center;gap:10px;padding-bottom:14px;
    font-size:12px;color:var(--ink-3);
  }
  .runbar .ln{flex:1;height:1px;background:var(--border)}

  /* 一步一行；图标列的竖线把整条流串成一个过程 */
  .step{position:relative;padding:0 0 2px 40px}
  .step::before{
    content:"";position:absolute;left:12.5px;top:26px;bottom:-2px;width:1px;background:var(--border-2);
  }
  .step:last-child::before{display:none}
  .step .ic{
    position:absolute;left:0;top:4px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;background:var(--panel-2);
    border:1px solid var(--border-2);color:var(--ink-3);
  }
  .step .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .step.ok .ic{background:var(--auto-soft);border-color:transparent;color:var(--auto)}
  .step.partial .ic{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .step.failed .ic{background:var(--down-soft);border-color:transparent;color:var(--down)}
  .step.live .ic{background:var(--needs);border-color:transparent;color:var(--on-accent)}
  .step.wait .ic{background:var(--needs-soft);border-color:transparent;color:var(--needs)}
  .step.queued .ic{opacity:.55}

  /* 整页唯一一处持续动画：当前步的心跳。它回答「卡住了还是在跑」 */
  .step.live .ic::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1.5px solid var(--needs);opacity:.5;animation:beat 1.6s var(--ease) infinite;
  }
  @keyframes beat{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:0;transform:scale(1.22)}}

  .step .hd{
    display:flex;align-items:baseline;gap:10px;padding:6px 8px 6px 0;border-radius:var(--r-xs);
    cursor:pointer;transition:background .16s ease;
  }
  .step .hd:hover{background:var(--panel-2)}
  .step.queued .hd{cursor:default}
  .step.queued .hd:hover{background:none}
  .step .lab{font-size:13.5px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
  .step.queued .lab{color:var(--ink-4);font-weight:500}
  .step .dur{
    margin-left:auto;flex:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-4);
    font-variant-numeric:tabular-nums;
  }
  .step .cv{flex:none;width:13px;height:13px;color:var(--ink-4);transition:transform .22s var(--ease)}
  .step.open .cv{transform:rotate(90deg)}
  .step .res{
    font-size:12.5px;color:var(--ink-3);padding:0 0 12px;margin-top:-2px;
    display:flex;gap:7px;align-items:flex-start;overflow-wrap:anywhere;
  }
  .step .res b{color:var(--ink-2);font-weight:600}
  .step.failed .res{color:var(--down)}

  /* 展开 = 证据。逐字照抄，不排版成人话 */
  .ev{
    display:none;margin:2px 0 14px;border:1px solid var(--border);border-radius:var(--r-sm);
    background:var(--panel-2);overflow:hidden;
  }
  .step.open .ev{display:block}
  .ev .kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 14px;padding:11px 13px;border-bottom:1px solid var(--border)}
  .ev .kv:last-child{border-bottom:none}
  .ev .k{font-size:11px;color:var(--ink-4);letter-spacing:.04em;padding-top:2px}
  .ev .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:pre-wrap;max-height:160px;overflow:auto;line-height:1.65}
  .ev .v.plain{font-family:var(--sans);font-size:12.5px}
  .ev .lnk{color:var(--needs);font-weight:600;font-size:12px;font-family:var(--sans)}
  .ev .lnk:hover{text-decoration:underline}
  .ev .foot{display:flex;gap:16px;padding:9px 13px;background:var(--bg);font-size:11px;color:var(--ink-4);font-family:var(--mono)}
  .ev .retry{
    margin-left:auto;color:var(--down);font-weight:600;font-family:var(--sans);font-size:11.5px;
  }
  .ev .retry:hover{text-decoration:underline}

  /* ── 审批卡：长在流里，不是弹窗 ─────────────────────────── */
  .appr{
    border:1px solid var(--needs);border-radius:var(--r);background:var(--bg);
    box-shadow:0 18px 40px -30px rgba(156,74,56,.55);margin:4px 0 16px;overflow:hidden;
  }
  .appr .top{
    display:flex;align-items:center;gap:9px;padding:11px 15px;
    background:var(--needs-soft);color:var(--needs);font-size:12px;font-weight:700;letter-spacing:.02em;
  }
  .appr .top svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .appr .body{padding:15px}
  .appr .row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:5px 14px;margin-bottom:12px}
  .appr .k{font-size:11.5px;color:var(--ink-4);padding-top:3px}
  .appr .what{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
  .appr .cost{font-size:13px;color:var(--ink-2);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .appr .cost .big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--warn);letter-spacing:-.02em}
  .appr .cost .irr{color:var(--down);font-weight:600;font-size:12px}
  .appr .why{font-size:12.5px;color:var(--ink-3);line-height:1.55}
  .appr .why .lnk{color:var(--needs);font-weight:600}
  .appr .why .lnk:hover{text-decoration:underline}
  .appr .acts{display:flex;gap:9px;padding-top:3px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;
    border-radius:var(--r-sm);font-size:13px;font-weight:600;letter-spacing:-.01em;
    transition:background .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease;
  }
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn.pri{background:var(--needs);color:var(--on-accent)}
  .btn.pri:hover{background:#84392a}
  .btn.ghost{background:var(--bg);color:var(--ink-2);border:1px solid var(--border-2)}
  .btn.ghost:hover{background:var(--panel-2)}
  .btn.danger{background:var(--bg);color:var(--down);border:1px solid var(--down-soft)}
  .btn.danger:hover{background:var(--down-soft)}
  .btn.sm{height:32px;padding:0 12px;font-size:12.5px}
  .btn[disabled]{opacity:.42;cursor:not-allowed}
  .btn.stop{background:var(--panel-2);color:var(--down);border:1px solid var(--border-2)}
  .btn.stop:not([disabled]):hover{background:var(--down);color:var(--on-accent);border-color:transparent}

  .note{
    font-size:11.5px;color:var(--ink-4);padding:8px 15px;border-top:1px solid var(--border);
    background:var(--panel-2);
  }

  /* 流式输出：块内打字，不推动页面 */
  .say{
    border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);
    padding:12px 14px;margin:2px 0 14px;font-size:13px;line-height:1.7;color:var(--ink-2);
    min-height:76px;
  }
  .say .cur{
    display:inline-block;width:7px;height:14px;background:var(--needs);
    vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2,start) infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .say .skip{float:right;font-size:11px;color:var(--ink-4);margin-left:12px}
  .say .skip:hover{color:var(--needs)}

  /* ── 底部：回执行 + 输入 + 常驻停止 ──────────────────────── */
  .composer{flex:none;border-top:1px solid var(--border);background:var(--bg);padding:11px 24px 16px}
  .receipt{
    display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;
    color:var(--ink-4);padding-bottom:9px;font-variant-numeric:tabular-nums;
  }
  .receipt .sep{width:1px;height:10px;background:var(--border-2)}
  .receipt .cost{color:var(--ink-2);font-weight:600}
  .cbox{
    display:flex;align-items:center;gap:10px;border:1px solid var(--border-2);border-radius:var(--r);
    background:var(--panel-2);padding:8px 8px 8px 15px;transition:border-color .18s ease;
  }
  .cbox:focus-within{border-color:var(--needs)}
  .cbox input{
    flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--sans);
    font-size:13.5px;color:var(--ink-1);height:30px;
  }
  .cbox input::placeholder{color:var(--ink-4)}

  /* ── 右栏：产物 / 上下文 / 预算(过去与凭据) ────────────── */
  .aside{
    background:var(--page);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .aside-hd{
    flex:none;height:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 18px;
    border-bottom:1px solid var(--border);font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  }
  .aside-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px}
  .aside-scroll::-webkit-scrollbar{width:8px}
  .aside-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
  .card{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
  }
  .card .ch{
    display:flex;align-items:center;gap:8px;padding:12px 14px 10px;
    font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  }
  .card .ch .tag{
    margin-left:auto;font-size:10.5px;font-weight:600;color:var(--ink-4);
    font-family:var(--mono);letter-spacing:0;
  }
  .card .cb{padding:0 14px 14px}
  .art table{width:100%;border-collapse:collapse;font-size:12px}
  .art th{
    text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);
    font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border);line-height:1.4;
  }
  .art td{padding:8px;border-bottom:1px solid var(--border);color:var(--ink-2)}
  .art tr:last-child td{border-bottom:none}
  .art td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
  .art .more{font-size:11.5px;color:var(--ink-4);padding:9px 8px 0}
  .artacts{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--border);background:var(--panel-2)}
  .tinybtn{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);
    background:var(--bg);border:1px solid var(--border-2);border-radius:99px;padding:5px 11px;
    transition:background .16s ease;
  }
  .tinybtn:hover{background:var(--page)}
  .tinybtn.back{color:var(--needs);border-color:var(--needs-soft)}
  .tinybtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .ctx{display:flex;flex-direction:column;gap:9px}
  .ctx .l{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
  .ctx .l .b{
    width:22px;height:22px;border-radius:var(--r-xs);flex:none;display:grid;place-items:center;
    background:var(--panel-2);color:var(--ink-3);border:1px solid var(--border);
  }
  .ctx .l .b svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
  .ctx .l .x{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-4)}

  /* 预算：有界的条，不是一个孤零零的数字 */
  .bud .top{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}

  .bud .track{height:7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden}
  .bud .fill{
    display:block;height:100%;border-radius:99px;background:var(--auto);width:0;
    transition:width 1.1s var(--ease);
  }
  .bud .cap{font-size:11.5px;color:var(--ink-4);margin-top:8px;line-height:1.5}
  .bud .cap b{color:var(--ink-2);font-weight:600}

  @media (max-width:1180px){
    .app{grid-template-columns:250px minmax(0,1fr)}
    .aside{display:none}
  }
  @media (max-width:860px){
    .app{grid-template-columns:minmax(0,1fr)}

  @media (prefers-reduced-motion:reduce){

  /* ── 左轨 ─────────────────────────────────────────── */
  function renderRail(){

      const on = r.id === cur ? ' on' : '';

    if (st === 'waiting') return 'wait';
    if (st === 'queued') return 'queued';
    return isLive ? 'live' : '';
  }
  function icFor(s){
    if (s.st === 'succeeded') return ICON.ok;
    if (s.st === 'failed') return ICON.fail;
    return ICON[s.ty] || ICON.think;
  }

    if (!s.ev) return '';

      `<div class="kv"><span class="k">入参</span><span class="v">${s.ev.in}</span></div>`,

    if (s.ev.warn) rows.push(`<div class="kv"><span class="k">注意</span><span class="v plain" style="color:var(--warn)">${s.ev.warn}</span></div>`);
    if (s.ev.link) rows.push(`<div class="kv"><span class="k">名单</span><span class="v plain"><button class="lnk" data-jump="art">${s.ev.link}</button></span></div>`);

    $('#btnStop2').disabled = !stoppable;

    const liveIdx = r.steps.findIndex(x => ['thinking','tool','streaming'].includes(x.st));
    // 停了/失败了以后，剩下几步没跑要说出来 —— 悄悄把它们删掉就等于假装任务只有这么长
    const left = r.steps.filter(x => x.st === 'queued').length;
    const tail = ['stopped','failed'].includes(r.st) && left
      ? `共 ${r.steps.length} 步 · 剩 ${left} 步未执行` : `共 ${r.steps.length} 步`;
    $('#stream').innerHTML =
      `<div class="runbar"><span>今天 ${r.when.replace(' 触发','')} 开始</span><i class="ln"></i><span>${tail}</span></div>` +
      r.steps.map((st, i) => {
        const cls = stepClass(st.st, i === liveIdx);
        // 失败的步骤默认展开：要点开才看得见的失败，就是在藏失败
        const open = st.open || st.st === 'failed' ? ' open' : '';
        const res = st.res ? `<div class="res">↳ <span>${st.res}</span></div>` : '';
        const dur = st.dur ? `<span class="dur">${st.dur}</span>` : '';
        // 流式输出块长在「正在输出」那一步里，不是甩在流的最底下
        const say = (st.st === 'streaming' && r.say) ? '<div class="say" id="say"></div>' : '';
        return `<div class="step ${cls}${open}" data-i="${i}"${st.anchor ? ' id="step2"' : ''}>
          <span class="ic"><svg viewBox="0 0 24 24">${icFor(st)}</svg></span>
          <div class="hd"><span class="lab">${st.lab}</span>${dur}${st.ev ? CV : ''}</div>
          ${res}${evBlock(st)}${say}${st.appr ? apprBlock() : ''}
        </div>`;
      }).join('');

    renderArt(r.art);

    const rc = r.receipt;
    $('#receipt').innerHTML =
      `<span>${rc.step}</span><i class="sep"></i><span>${rc.dur}</span><i class="sep"></i>` +
      `<span>${rc.tok}</span><i class="sep"></i><span class="cost">${rc.cost}</span>` +
      `<span style="margin-left:auto">${STATE[r.st].t}</span>`;

    bind();
  }

  function bind(){
    document.querySelectorAll('.step .hd').forEach(hd => hd.addEventListener('click', () => {
      const step = hd.closest('.step');
      if (!step.querySelector('.ev')) return;
      step.classList.toggle('open');
    }));
    document.querySelectorAll('[data-appr]').forEach(b => b.addEventListener('click', () => approve(b.dataset.appr)));
    document.querySelectorAll('[data-jump="step2"]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const el = document.getElementById('step2');
      if (!el) return;
      el.classList.add('open');
      el.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block:'center'});
    }));
    document.querySelectorAll('[data-jump="art"]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelector('.aside-scroll').scrollTo({top:0, behavior: RM ? 'auto' : 'smooth'});
    }));
    const rt = document.querySelector('[data-retry]');
    if (rt) rt.addEventListener('click', e => { e.stopPropagation(); retryFrom(); });
  }

  /* ── 审批：批准后任务接着跑，流式输出落到块里，产物落到右栏 ── */
  function approve(kind){
    const r = RUNS['#R-2418'];
    if (kind === 'no'){
      r.steps[4] = {ty:'fail', st:'failed', lab:'你拒绝了发送短信', res:'任务在第 5 步终止，没有任何短信发出', dur:'—',
        ev:{in:'operator: 周野 · 14:09', out:'REJECTED · 0 sent\n37 单保持未处理，可改方案后重跑', cost:'人工决定 · 0 token', fail:true}};
      r.st = 'stopped';
      setRow('#R-2418', 'stopped', '你在第 5/9 步拒绝');
      renderRail(); renderRun();
      return;
    }
    if (kind === 'edit'){
      const card = document.querySelector('.appr .body');
      card.insertAdjacentHTML('afterbegin',
        `<div class="row"><span class="k">改哪里</span><span class="why" style="color:var(--ink-2)">
          面额 <b>¥15</b> → 可改；话术模板可换；名单可勾掉个别单。改完会重新算一次影响。</span></div>`);
      return;
    }
    r.steps[4] = {ty:'ok', st:'succeeded', lab:'你批准了发送短信', res:'周野 于 14:09 批准 · 已记入审计', dur:'—',
      ev:{in:'operator: 周野 · 14:09:22', out:'APPROVED · scope=37 · amount=¥2.22', cost:'人工决定 · 0 token'}};
    r.steps[5] = {ty:'send', st:'succeeded', lab:'发送短信并核销优惠券', res:'<b>37 条</b>已发出，0 条失败', dur:'4.10s',
      ev:{in:'template: T-refund-15 · 37 numbers', out:'37 sent · 0 failed\ncoupon_batch: CP-20260804-15', cost:'耗时 4.10s · 0.3k token'}};
    r.steps[6] = {ty:'write', st:'streaming', lab:'把处理结果写回工单'};
    r.st = 'streaming';
    r.say = true;
    r.receipt = {step:'7/9 步', dur:'48.9s', tok:'19.4k token', cost:'¥0.44'};
    setRow('#R-2418', 'streaming', '第 7/9 步 · 正在写回工单');
    renderRail(); renderRun();
    stream('已批准。37 张 ¥15 无门槛券已核销并随短信发出，正在把处理结果写回对应工单，' +
           '第 3 步跳过的 4 单我单独挂了待办，不会混进这次的补发口径里。');
  }

  /* 流式：一帧一小段，可跳过，容器不推动页面(min-height 已预留) */
  function stream(text){
    const box = $('#say');
    if (!box) return;
    if (RM){ box.textContent = text; return; }   // 降级：整块出现
    box.innerHTML = '<button class="skip" id="skip">跳过动画</button><span id="txt"></span><span class="cur"></span>';
    const txt = $('#txt');
    let i = 0, stop = false;
    $('#skip').addEventListener('click', () => { stop = true; txt.textContent = text; box.querySelector('.cur').remove(); });
    (function tick(){
      if (stop) return;
      txt.textContent = text.slice(0, i += 2);
      if (i < text.length) requestAnimationFrame(tick);
      else box.querySelector('.cur')?.remove();
    })();
  }

  /* ── 停止：当帧就落地，并说出死在第几步 ── */
  function stopRun(){
    const r = RUNS[cur];
    if (!['waiting','thinking','tool','streaming'].includes(r.st)) return;
    const at = r.steps.findIndex(s => ['waiting','thinking','tool','streaming'].includes(s.st));
    const n = at < 0 ? r.steps.length : at + 1;
    if (at >= 0){
      r.steps[at] = {ty:'fail', st:'stopped', lab:`你在第 ${n} 步停止了任务`,
        res:`「${r.steps[at].lab}」没有执行，前 ${n - 1} 步的结果都还在`, dur:'—',
        ev:{in:'operator: 周野', out:`STOPPED at step ${n}/${r.steps.length}\n可从这一步续跑，也可丢弃`, cost:'人工决定 · 0 token'}};
    }
    r.st = 'stopped'; r.say = false;
    setRow(cur, 'stopped', `你在第 ${n}/${r.steps.length} 步停止`);
    renderRail(); renderRun();
  }

  function retryFrom(){
    const r = RUNS['#R-2417'];
    r.steps[2] = {ty:'net', st:'succeeded', lab:'调用承运商明细接口', res:'换用新 token 后取回 <b>214</b> 条明细', dur:'3.30s',
      ev:{in:'GET /carrier/sf/detail (token refreshed 14:11)', out:'200 OK · 214 details', cost:'耗时 3.30s · 0.9k token'}};
    r.steps[3].st = 'thinking';
    r.st = 'thinking';
    r.receipt = {step:'4/6 步', dur:'15.2s', tok:'7.1k token', cost:'¥0.16'};
    setRow('#R-2417', 'thinking', '第 4/6 步 · 正在归因');
    renderRail(); renderRun();
  }

  function setRow(id, st, meta){
    const row = LIST.find(x => x.id === id);
    if (!row) return;
    row.st = st; row.meta = meta;
    row.live = ['thinking','tool','streaming','waiting'].includes(st);
    $('#cRun').textContent = LIST.filter(x => x.live).length;
    $('#cDone').textContent = LIST.filter(x => !x.live && x.st !== 'queued').length;
  }

  /* ── 右栏：产物随任务切换。凭据是这条任务的凭据，不是常驻装饰 ── */
  function renderArt(a){
    $('#artTitle').innerHTML = `${a.t} <span class="tag">${a.tag}</span>`;
    $('#artHead').innerHTML = '<tr>' + a.cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
    $('#artBody').innerHTML = a.rows.map(row =>
      '<tr>' + row.map((v, i) => `<td class="${a.num.includes(i) ? 'n' : ''}">${v}</td>`).join('') + '</tr>').join('');
    $('#artMore').textContent = a.more;
    $('#backLab').textContent = a.back;
  }

  $('#btnStop').addEventListener('click', stopRun);
  $('#btnStop2').addEventListener('click', stopRun);
  $('#btnBack').addEventListener('click', () => {
    const el = document.getElementById('step2');
    if (!el) return;
    el.classList.add('open');
    el.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block:'center'});
  });

  renderRail();
  renderRun();
  // 预算条：一次性长到位；reduced-motion 下直接落终态
  requestAnimationFrame(() => { $('#budFill').style.width = '36%'; });
</script>
</body>
</html>
