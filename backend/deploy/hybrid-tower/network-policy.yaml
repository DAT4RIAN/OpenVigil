apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windops-structural-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: structural-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              windops.openai.com/structural-dependency-access: "true"
          podSelector:
            matchLabels:
              windops.openai.com/structural-dependency-access: "true"
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
