apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windops-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windops-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: windops-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              windops.openai.com/gateway-access: "true"
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windops-runtime-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [care-worker]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              windops.openai.com/runtime-dependency-access: "true"
          podSelector:
            matchLabels:
              windops.openai.com/runtime-dependency-access: "true"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: windops-care-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: care-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              windops.openai.com/care-dependency-access: "true"
          podSelector:
            matchLabels:
              windops.openai.com/care-dependency-access: "true"
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9000
