apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: windops-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: windops-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: windops-api
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
