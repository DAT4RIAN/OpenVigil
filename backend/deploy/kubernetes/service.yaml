apiVersion: v1
kind: ServiceAccount
metadata:
  name: windops-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: windops-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
