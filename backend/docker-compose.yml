# DEV-ONLY dependency stack. It binds only to loopback and is not a production
# deployment manifest (no service TLS, secret manager, or network policy).
services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: windops
      POSTGRES_USER: windops
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windops -d windops"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - windops-postgres:/home/postgres/pgdata/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - windops-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: windops
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - windops-minio:/data

volumes:
  windops-postgres:
  windops-redis:
  windops-minio:
