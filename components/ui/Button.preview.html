<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button glass states preview</title>
    <link rel="stylesheet" href="../../app/styles/01-foundations.css" />
    <link rel="stylesheet" href="../../app/styles/15-button-glass.css" />
    <style>
      body {
        min-height: 100dvh;
        padding: 32px;
      }
      main {
        display: grid;
        gap: 18px;
        margin: 0 auto;
        max-width: 720px;
      }
      header,
      .preview-grid {
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }
      header {
        padding: 20px;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: 22px;
      }
      p {
        color: var(--foreground-muted);
        margin-top: 8px;
      }
      .preview-grid {
        display: grid;
        gap: 1px;
        overflow: hidden;
      }
      .preview-row {
        align-items: center;
        background: var(--surface-subtle);
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(120px, 0.45fr) minmax(0, 1fr);
        min-height: 68px;
        padding: 12px 16px;
      }
      .preview-row > span {
        color: var(--foreground-muted);
        font-size: var(--font-secondary);
        font-weight: 700;
      }
      @media (max-width: 520px) {
        body {
          padding: 16px;
        }
        .preview-row {
          align-items: start;
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Button · 8 states</h1>
        <p>临时验收页；用于同时检查玻璃边缘、语义状态、焦点与按压反馈。</p>
      </header>
      <section class="preview-grid" aria-label="按钮八状态预览">
        <div class="preview-row">
          <span>default</span>
          <button class="button button--primary button--md" type="button">
            <span class="button__content">保存更改</span>
          </button>
        </div>
        <div class="preview-row">
          <span>hover</span>
          <button class="button button--secondary button--md is-hover" type="button">
            <span class="button__content">查看详情</span>
          </button>
        </div>
        <div class="preview-row">
          <span>focus-visible</span>
          <button class="button button--secondary button--md is-focus" type="button">
            <span class="button__content">键盘焦点</span>
          </button>
        </div>
        <div class="preview-row">
          <span>active</span>
          <button class="button button--primary button--md is-active" type="button">
            <span class="button__content">正在按下</span>
          </button>
        </div>
        <div class="preview-row">
          <span>disabled</span>
          <button class="button button--secondary button--md" type="button" disabled>
            <span class="button__content">暂不可用</span>
          </button>
        </div>
        <div class="preview-row">
          <span>loading</span>
          <button
            class="button button--primary button--md"
            type="button"
            data-state="loading"
            aria-busy="true"
            disabled
          >
            <span class="button__content">保存更改</span>
            <span class="button__state" aria-hidden="true">◌</span>
          </button>
        </div>
        <div class="preview-row">
          <span>error</span>
          <button class="button button--secondary button--md" type="button" data-state="error">
            <span class="button__content">连接失败，请重试</span>
          </button>
        </div>
        <div class="preview-row">
          <span>success</span>
          <button class="button button--secondary button--md" type="button" data-state="success">
            <span class="button__content">更改已保存</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
