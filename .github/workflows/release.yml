name: release-candidate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable approved release identifier
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-qualify:
    name: build-sign-and-qualify
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      IMAGE_REPOSITORY: ${{ vars.WINDOPS_IMAGE_REPOSITORY }}
      WINDOPS_ISOLATED_RELEASE_ENV_B64: ${{ secrets.WINDOPS_ISOLATED_RELEASE_ENV_B64 }}
      WINDOPS_INDEPENDENT_EVIDENCE_URL: ${{ vars.WINDOPS_INDEPENDENT_EVIDENCE_URL }}
      WINDOPS_INDEPENDENT_EVIDENCE_SHA256: ${{ vars.WINDOPS_INDEPENDENT_EVIDENCE_SHA256 }}
      WINDOPS_INDEPENDENT_EVIDENCE_TOKEN: ${{ secrets.WINDOPS_INDEPENDENT_EVIDENCE_TOKEN }}
      WINDOPS_FAIL_ON_SKIPPED: "1"
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate protected release inputs and prior CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code --quiet
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$ ]]
          [[ ! "${RELEASE_ID,,}" =~ ^(development|unknown|unreleased)$ ]]
          [[ "${IMAGE_REPOSITORY}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          test -n "${WINDOPS_ISOLATED_RELEASE_ENV_B64}"
          [[ "${WINDOPS_INDEPENDENT_EVIDENCE_URL}" =~ ^https:// ]]
          [[ "${WINDOPS_INDEPENDENT_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${WINDOPS_INDEPENDENT_EVIDENCE_TOKEN}"
          echo "RELEASE_STARTED_AT=$(date --utc +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[]' \
            | python backend/scripts/verify_release_checks.py --sha "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"

      - name: Install frozen release tooling
        run: uv sync --project backend --frozen --all-extras

      - name: Load approved release policy
        id: policy
        run: |
          set -euo pipefail
          base_image="$(jq -er '.python_base_image' backend/deploy/release-policy.json)"
          postgres_client_image="$(jq -er '.postgres_client_image' backend/deploy/release-policy.json)"
          postgres_client_major="$(jq -er '.postgres_client_major' backend/deploy/release-policy.json)"
          platform="$(jq -er '.platform' backend/deploy/release-policy.json)"
          storage_class="$(jq -er '.approved_backup_storage_class' backend/deploy/release-policy.json)"
          [[ "${base_image}" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ ! "${base_image}" =~ sha256:0{64}$ ]]
          [[ "${postgres_client_image}" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "${postgres_client_major}" == "16" ]]
          echo "base_image=${base_image}" >> "${GITHUB_OUTPUT}"
          echo "postgres_client_image=${postgres_client_image}" >> "${GITHUB_OUTPUT}"
          echo "postgres_client_major=${postgres_client_major}" >> "${GITHUB_OUTPUT}"
          echo "platform=${platform}" >> "${GITHUB_OUTPUT}"
          echo "storage_class=${storage_class}" >> "${GITHUB_OUTPUT}"

      - name: Log in to protected registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push the multi-entrypoint backend image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ steps.policy.outputs.platform }}
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.policy.outputs.base_image }}
            POSTGRES_CLIENT_IMAGE=${{ steps.policy.outputs.postgres_client_image }}
            POSTGRES_CLIENT_MAJOR=${{ steps.policy.outputs.postgres_client_major }}
            WINDOPS_RELEASE_ID=${{ env.RELEASE_ID }}
            WINDOPS_COMMIT_SHA=${{ github.sha }}
            WINDOPS_SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Export immutable image identity
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${{ steps.build.outputs.digest }}" != "sha256:$(printf '0%.0s' {1..64})"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}" >> "${GITHUB_ENV}"
          evidence_set_digest="$(printf '%s\n%s\n%s\n' "${RELEASE_ID}" "${GITHUB_SHA}" "${{ steps.build.outputs.digest }}" | sha256sum | cut -d' ' -f1)"
          echo "EVIDENCE_SET_ID=sha256:${evidence_set_digest}" >> "${GITHUB_ENV}"

      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign and verify the immutable image
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cosign sign --yes "${IMAGE_REF}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" > release-evidence/signature-verification.json

      - name: Scan immutable image for blocking vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: json
          output: release-evidence/image-scan.json
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: release-evidence/sbom.spdx.json
          exit-code: "0"

      - name: Attest and verify the SBOM
        run: |
          set -euo pipefail
          test -s release-evidence/sbom.spdx.json
          jq -e '.spdxVersion and (.packages | length > 0)' release-evidence/sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate release-evidence/sbom.spdx.json "${IMAGE_REF}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" > release-evidence/sbom-attestation-verification.json

      - name: Verify image structure, labels, entrypoints, lock, and client compatibility
        working-directory: backend
        run: >-
          uv run windops-container-artifact
          --image "${IMAGE_REF}"
          --release-id "${RELEASE_ID}"
          --commit-sha "${GITHUB_SHA}"
          --source-url "https://github.com/${GITHUB_REPOSITORY}"
          --policy deploy/release-policy.json
          --report ../release-evidence/container-artifact.json

      - name: Load protected isolated production configuration
        env:
          WINDOPS_RELEASE_ENV_PATH: ${{ runner.temp }}/windops-release.env
        run: |
          set -euo pipefail
          uv run --project backend python backend/scripts/load_release_environment.py
          echo "WINDOPS_RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"
          echo "WINDOPS_RELEASE_COMMIT_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "WINDOPS_RELEASE_IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_ENV}"
          printf '%s\n' \
            "WINDOPS_RELEASE_ID=${RELEASE_ID}" \
            "WINDOPS_RELEASE_COMMIT_SHA=${GITHUB_SHA}" \
            "WINDOPS_RELEASE_IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${RUNNER_TEMP}/windops-release.env"

      - name: Run production migration and dependency readiness from the built image
        working-directory: backend
        run: >-
          uv run windops-release-smoke
          --image "${IMAGE_REF}"
          --network bridge
          --environment-file "${RUNNER_TEMP}/windops-release.env"
          --release-id "${RELEASE_ID}"
          --commit-sha "${GITHUB_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --report ../release-evidence/release-image-smoke.json

      - name: Run checkpoint, resume, and idempotency smoke in the built CARE workload
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/windops-care-workload-smoke"
          mkdir -p "${smoke_dir}"
          sudo chown 10001:10001 "${smoke_dir}"
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env "WINDOPS_CARE_QUEUE=care-v6-offline" \
            --env "WINDOPS_CARE_MAX_CONCURRENCY=1" \
            --env "WINDOPS_CARE_MAX_ATTEMPTS=3" \
            --env "WINDOPS_RELEASE_ID=${RELEASE_ID}" \
            --env "WINDOPS_RELEASE_COMMIT_SHA=${GITHUB_SHA}" \
            --env "WINDOPS_RELEASE_IMAGE_DIGEST=${IMAGE_DIGEST}" \
            --volume "${GITHUB_WORKSPACE}/backend/src/windops_backend/benchmarks/care/smoke_fixture.csv:/care/source/smoke_fixture.csv:ro" \
            --volume "${smoke_dir}:/care/work" \
            "${IMAGE_REF}" windops-care-workload-smoke \
            --source /care/source/smoke_fixture.csv \
            --workspace /care/work/pipeline \
            --requirements-lock /app/requirements.container.txt \
            --report /care/work/care-execution-plane-smoke.json
          cp "${smoke_dir}/care-execution-plane-smoke.json" release-evidence/
          test "${smoke_dir}" = "${RUNNER_TEMP}/windops-care-workload-smoke"
          rm -rf -- "${smoke_dir}"

      - name: Render and verify all Kubernetes workloads at the exact digest
        run: |
          set -euo pipefail
          kubectl kustomize backend/deploy/kubernetes > release-evidence/kustomize-base.yaml
          uv run --project backend python backend/scripts/render_release_manifests.py \
            --input release-evidence/kustomize-base.yaml \
            --output release-evidence/rendered-manifests.yaml \
            --release-id "${RELEASE_ID}" \
            --commit-sha "${GITHUB_SHA}" \
            --image "${IMAGE_REF}"
          uv run --project backend windops-deployment-policy \
            --manifests release-evidence/rendered-manifests.yaml \
            --expected-image-digest "${IMAGE_DIGEST}" \
            --expected-release-id "${RELEASE_ID}" \
            --expected-commit-sha "${GITHUB_SHA}" \
            --approved-backup-storage-class "${{ steps.policy.outputs.storage_class }}" \
            --report release-evidence/deployment-policy.json
          if rg -n 'registry\.invalid|sha256:0{64}|\b(unreleased|unknown)\b' release-evidence/rendered-manifests.yaml; then
            exit 1
          fi

      - name: Run non-skipped isolated production dependency acceptance
        working-directory: backend
        env:
          WINDOPS_RUN_EXTERNAL_RELEASE_TESTS: "1"
        run: >-
          uv run pytest tests/external/test_release_environment.py
          -m external_release
          --junitxml=../release-evidence/external-release-junit.xml
          -q

      - name: Create a verified backup from the release image
        run: |
          set -euo pipefail
          backup_dir="${RUNNER_TEMP}/windops-release-backup"
          mkdir -p "${backup_dir}"
          sudo chown 10001:10001 "${backup_dir}"
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env-file "${RUNNER_TEMP}/windops-release.env" \
            --volume "${backup_dir}:/evidence" \
            "${IMAGE_REF}" windops-backup --output-dir /evidence
          test -n "$(find "${backup_dir}" -type f -print -quit)"
          find "${backup_dir}" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > release-evidence/backup-verification.sha256
          test "${backup_dir}" = "${RUNNER_TEMP}/windops-release-backup"
          rm -rf -- "${backup_dir}"

      - name: Record backend-to-Sites immutable release bindings
        run: |
          printf '%s\n' \
            "WINDOPS_BACKEND_EXPECTED_RELEASE_ID=${RELEASE_ID}" \
            "WINDOPS_BACKEND_EXPECTED_COMMIT_SHA=${GITHUB_SHA}" \
            "WINDOPS_BACKEND_EXPECTED_IMAGE_DIGEST=${IMAGE_DIGEST}" \
            > release-evidence/sites-release-bindings.env

      - name: Stage content-addressed independently reviewed gates
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/windops-independent-release-evidence.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer ${WINDOPS_INDEPENDENT_EVIDENCE_TOKEN}" \
            --output "${archive}" \
            "${WINDOPS_INDEPENDENT_EVIDENCE_URL}"
          printf '%s  %s\n' "${WINDOPS_INDEPENDENT_EVIDENCE_SHA256}" "${archive}" \
            | sha256sum --check --strict
          uv run --project backend python backend/scripts/stage_independent_release_evidence.py \
            --archive "${archive}" \
            --evidence-dir release-evidence
          rm -f -- "${archive}"

      - name: Verify protected full-scale CARE acceptance for this image
        run: >-
          uv run --project backend windops-care-fullscale-acceptance
          --evidence release-evidence/artifacts/care/care-full-scale-release-evidence.json
          --evidence-root release-evidence
          --storage-policy backend/deploy/care-minio-worker-policy.json
          --release-id "${RELEASE_ID}"
          --commit-sha "${GITHUB_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --report release-evidence/care-full-scale-acceptance.json

      - name: Standardize image, supply-chain, deployment, and production-runtime reports
        run: |
          set -euo pipefail
          approval_reference="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          completed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          common=(
            --evidence-dir release-evidence
            --release-id "${RELEASE_ID}"
            --commit-sha "${GITHUB_SHA}"
            --image-digest "${IMAGE_DIGEST}"
            --evidence-set-id "${EVIDENCE_SET_ID}"
            --started-at "${RELEASE_STARTED_AT}"
            --completed-at "${completed_at}"
            --approved-by "github-actions/${GITHUB_ACTOR}"
            --approval-reference "${approval_reference}"
          )
          uv run --project backend windops-release-evidence record "${common[@]}" \
            --gate image_scan --target "${IMAGE_REF}" \
            --tool-name trivy --tool-version b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 \
            --artifact image-scan.json=application/json \
            --artifact container-artifact.json=application/json \
            --check immutable_digest_scanned=container-artifact.json,image-scan.json \
            --check critical_findings_zero=image-scan.json \
            --check high_findings_zero=image-scan.json
          uv run --project backend windops-release-evidence record "${common[@]}" \
            --gate sbom --target "${IMAGE_REF}" \
            --tool-name trivy-cosign --tool-version 1 \
            --artifact sbom.spdx.json=application/spdx+json \
            --artifact sbom-attestation-verification.json=application/json \
            --check immutable_digest_bound=sbom-attestation-verification.json \
            --check components_present=sbom.spdx.json \
            --check format_validated=sbom.spdx.json
          uv run --project backend windops-release-evidence record "${common[@]}" \
            --gate signature_verification --target "${IMAGE_REF}" \
            --tool-name cosign --tool-version 3.10.0 \
            --artifact signature-verification.json=application/json \
            --check digest_verified=signature-verification.json \
            --check signer_identity_verified=signature-verification.json \
            --check signature_policy_verified=signature-verification.json
          uv run --project backend windops-release-evidence record "${common[@]}" \
            --gate deployment_policy --target kubernetes/production \
            --tool-name windops-deployment-policy --tool-version 1 \
            --artifact rendered-manifests.yaml=application/yaml \
            --artifact deployment-policy.json=application/json \
            --check rendered_manifests_validated=rendered-manifests.yaml,deployment-policy.json \
            --check immutable_digest_bound=rendered-manifests.yaml,deployment-policy.json \
            --check pod_security_validated=deployment-policy.json \
            --check network_policy_validated=deployment-policy.json \
            --check encrypted_backup_storage_validated=deployment-policy.json
          uv run --project backend windops-release-evidence record "${common[@]}" \
            --gate external_release --target isolated-production-candidate \
            --tool-name windops-release-smoke --tool-version 2 \
            --artifact release-image-smoke.json=application/json \
            --artifact external-release-junit.xml=application/xml \
            --artifact care-execution-plane-smoke.json=application/json \
            --artifact care-full-scale-acceptance.json=application/json \
            --artifact artifacts/care/care-full-scale-release-evidence.json=application/json \
            --check dependency_readiness=release-image-smoke.json,external-release-junit.xml \
            --check protected_metrics=external-release-junit.xml \
            --check object_roundtrip=external-release-junit.xml \
            --check embedding_provider=external-release-junit.xml \
            --check reasoning_provider=external-release-junit.xml \
            --check active_model_inference=external-release-junit.xml \
            --check care_execution_plane_smoke=care-execution-plane-smoke.json \
            --check care_full_scale_acceptance=care-full-scale-acceptance.json,artifacts/care/care-full-scale-release-evidence.json

      - name: Assemble the exact eleven-gate release manifest
        run: >-
          uv run --project backend windops-release-evidence assemble
          --evidence-dir release-evidence
          --release-id "${RELEASE_ID}"
          --commit-sha "${GITHUB_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --evidence-set-id "${EVIDENCE_SET_ID}"

      - name: Qualify only through the final release verifier
        run: |
          set -euo pipefail
          test ! -e release-evidence/release-qualification.json
          uv run --project backend windops-release-gate \
            --evidence-dir release-evidence \
            --qualification-output release-evidence/release-qualification.json \
            > release-evidence/release-verifier.json
          jq -e \
            --arg release_id "${RELEASE_ID}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg evidence_set_id "${EVIDENCE_SET_ID}" \
            '.status == "qualified" and .release_id == $release_id and .commit_sha == $commit_sha and .image_digest == $image_digest and .evidence_set_id == $evidence_set_id and .gate_count == 11' \
            release-evidence/release-qualification.json

      - name: Remove decoded protected configuration
        if: always()
        run: rm -f "${RUNNER_TEMP}/windops-release.env"

      - name: Preserve immutable release candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90
