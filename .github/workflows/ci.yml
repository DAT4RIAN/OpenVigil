name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reject generated caches and ungoverned large artifacts
        run: pnpm check:repository-artifacts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Format check
        run: pnpm format:check
      - name: Build, enforce bundle budget, and test with coverage budgets
        run: pnpm test:coverage
      - name: Build and smoke the standard production start command
        run: pnpm build && pnpm test:start-smoke

  browser-e2e:
    name: browser-e2e
    # Pixel baselines are generated and reviewed on Windows. Keeping this runner
    # explicit prevents cross-OS font rasterization from invalidating unchanged UI.
    runs-on: windows-2025
    env:
      WINDOPS_FAIL_ON_SKIPPED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install chromium
      - name: Build and run desktop/mobile browser contracts
        run: pnpm test:e2e
      - name: Preserve browser report, screenshots, traces, and failure videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-${{ github.sha }}
          path: |
            .artifacts/playwright
            tests/e2e/__screenshots__
          if-no-files-found: error

  real-cross-layer-e2e:
    name: real-cross-layer-e2e
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: timescale/timescaledb-ha@sha256:df8eaa04de65fbe238df8dbc356e79108bcb8166d3458833536a3ff745abb2be
        env:
          POSTGRES_DB: windops
          POSTGRES_USER: windops
          POSTGRES_PASSWORD: windops-real-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U windops -d windops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      WINDOPS_DATABASE_URL: postgresql+asyncpg://windops:windops-real-e2e@localhost:5432/windops
      WINDOPS_REAL_ROTATION_AUDIT_ID: real-worker-rotation-audit
      WINDOPS_REAL_ROTATION_REVISION_ID: real-worker-rotation-revision
      WINDOPS_E2E_SUBJECT: sites-release-manager
      WINDOPS_GATEWAY_DELEGATION_SECRET: real-worker-release-smoke-delegation-secret-with-at-least-forty-eight-characters
      WINDOPS_RELEASE_ID: real-worker-release-${{ github.run_id }}
      WINDOPS_RELEASE_COMMIT_SHA: ${{ github.sha }}
      WINDOPS_RELEASE_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      WINDOPS_E2E_RELEASE_ID: real-worker-release-${{ github.run_id }}
      WINDOPS_E2E_COMMIT_SHA: ${{ github.sha }}
      WINDOPS_E2E_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      WINDOPS_E2E_BACKEND_ORIGIN: https://127.0.0.1:8443
      WINDOPS_REAL_SMOKE_PORT: "8443"
      WINDOPS_FAIL_ON_SKIPPED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install frontend and backend dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e "./backend[test]"
      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Upgrade isolated database and seed a pending rotation
        working-directory: backend
        env:
          WINDOPS_RELEASE_SMOKE: "1"
        run: |
          alembic upgrade head
          python scripts/prepare_real_release_smoke.py
      - name: Generate an isolated TLS certificate
        run: |
          mkdir -p "$RUNNER_TEMP/windops-real-e2e"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/windops-real-e2e/key.pem" \
            -out "$RUNNER_TEMP/windops-real-e2e/cert.pem" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
          echo "WINDOPS_REAL_SMOKE_TLS_KEY=$RUNNER_TEMP/windops-real-e2e/key.pem" >> "$GITHUB_ENV"
          echo "WINDOPS_REAL_SMOKE_TLS_CERT=$RUNNER_TEMP/windops-real-e2e/cert.pem" >> "$GITHUB_ENV"
      - name: Start real FastAPI release-smoke backend
        working-directory: backend
        run: |
          uv run python scripts/run_real_release_smoke_server.py > "$RUNNER_TEMP/windops-real-e2e/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/windops-real-e2e/backend.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --insecure --fail https://127.0.0.1:8443/api/v1/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/windops-real-e2e/backend.log"
          exit 1
      - name: Build the real Worker production artifact
        run: |
          pnpm run build
          test -f dist/server/index.js
      - name: Run the real Worker-to-FastAPI browser smoke
        env:
          WINDOPS_E2E_REAL_BACKEND: "1"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: pnpm test:e2e:real
      - name: Preserve real cross-layer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-cross-layer-e2e-${{ github.sha }}
          path: |
            .artifacts/playwright
            ${{ runner.temp }}/windops-real-e2e/backend.log
          if-no-files-found: error
      - name: Stop real smoke backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/windops-real-e2e/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/windops-real-e2e/backend.pid")" || true
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras --all-groups
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify generated container dependency lock
        run: python scripts/export_container_requirements.py --check
      - name: Verify locked CARE benchmark import and CLI closure
        run: >-
          windops-care-dependency-closure
          --requirements-lock requirements.container.txt
          --uv-lock uv.lock
          --report care-benchmark-dependency-closure.json
      - name: Verify pinned official CARE reference equivalence
        run: python scripts/verify_care_reference.py --report care-reference-evidence.json
      - name: Determine coverage diff base
        id: coverage-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${GITHUB_SHA}^"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Tests with global, critical-module, and changed-line coverage budgets
        run: >-
          python -m pytest tests -q
          --cov=windops_backend
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --junitxml=backend-tests-junit.xml
          --cov-fail-under=68
      - name: Build zero-context coverage diff
        env:
          COVERAGE_BASE: ${{ steps.coverage-base.outputs.base }}
        run: git diff --unified=0 "$COVERAGE_BASE" "$GITHUB_SHA" -- src > coverage.diff
      - name: Enforce backend coverage budgets
        run: >-
          python scripts/check_coverage_budget.py
          --coverage-json coverage.json
          --diff-file coverage.diff
      - name: Ruff format check
        run: python -m ruff format --check src tests alembic scripts
      - name: Ruff lint
        run: python -m ruff check src tests alembic scripts
      - name: mypy
        run: python -m mypy --no-incremental src
      - name: Bandit
        run: python -m bandit -q -r src
      - name: pip-audit
        run: python -m pip_audit --skip-editable
      - name: Verify Alembic unique head and release declarations
        run: |
          alembic heads
          python scripts/verify_migration_head.py
      - name: Alembic offline migration render
        run: alembic upgrade head --sql > /dev/null
      - name: Preserve backend coverage and JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage.json
            backend/coverage.diff
            backend/backend-tests-junit.xml
            backend/care-benchmark-dependency-closure.json
            backend/care-reference-evidence.json
          if-no-files-found: error

  postgres-contract:
    name: postgres-contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha@sha256:df8eaa04de65fbe238df8dbc356e79108bcb8166d3458833536a3ff745abb2be
        env:
          POSTGRES_DB: windops
          POSTGRES_USER: windops
          POSTGRES_PASSWORD: windops-ci-contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U windops -d windops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      WINDOPS_DATABASE_URL: postgresql+asyncpg://windops:windops-ci-contract@localhost:5432/windops
      WINDOPS_POSTGRES_TEST_URL: postgresql+asyncpg://windops:windops-ci-contract@localhost:5432/windops
      WINDOPS_RUN_POSTGRES_CONTRACT_TESTS: "1"
      WINDOPS_RUN_POSTGRES_CONCURRENCY_TESTS: "1"
      WINDOPS_RUN_POSTGRES_READ_AUDIT_TESTS: "1"
      WINDOPS_FAIL_ON_SKIPPED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: |
          uv sync --frozen --extra test --extra benchmark
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify locked CARE benchmark import and CLI closure
        run: >-
          windops-care-dependency-closure
          --requirements-lock requirements.container.txt
          --uv-lock uv.lock
          --report care-benchmark-dependency-closure.json
      - name: Upgrade primary PostgreSQL database to head
        run: alembic upgrade head
      - name: Verify migrations, query plans, performance, locks, transactions, and uniqueness
        run: >-
          python -m pytest
          tests/external/test_postgres_migrations.py
          tests/external/test_postgres_concurrency.py
          tests/external/test_postgres_service_resilience.py
          tests/external/test_postgres_prediction_lock.py
          tests/external/test_postgres_read_audit.py
          -m external_release
          --junitxml=postgres-contract-junit.xml
          -q
      - name: Verify primary database remains at the unique head
        run: |
          alembic current
          python scripts/verify_migration_head.py
      - name: Preserve PostgreSQL contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-contract-${{ github.sha }}
          path: |
            backend/postgres-contract-junit.xml
            backend/care-benchmark-dependency-closure.json
          if-no-files-found: error

  care-postgres-contract:
    name: care-postgres-contract
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, windops-care-v6]
    timeout-minutes: 180
    services:
      postgres:
        image: timescale/timescaledb-ha@sha256:df8eaa04de65fbe238df8dbc356e79108bcb8166d3458833536a3ff745abb2be
        env:
          POSTGRES_DB: windops
          POSTGRES_USER: windops
          POSTGRES_PASSWORD: windops-care-contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U windops -d windops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: windops
      PGPASSWORD: windops-care-contract
      WINDOPS_RUN_POSTGRES_CONTRACT_TESTS: "1"
      WINDOPS_FAIL_ON_SKIPPED: "1"
      WINDOPS_CARE_REAL_ARTIFACT_ROOT: ${{ vars.WINDOPS_CARE_REAL_ARTIFACT_ROOT }}
      WINDOPS_CARE_FULL_SCALE_ROOT: ${{ vars.WINDOPS_CARE_FULL_SCALE_ROOT }}
      WINDOPS_POSTGRES_IMAGE: timescale/timescaledb-ha@sha256:df8eaa04de65fbe238df8dbc356e79108bcb8166d3458833536a3ff745abb2be
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the frozen CARE test closure
        run: |
          uv sync --frozen --extra test --extra benchmark
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Fail closed when official immutable CARE artifacts are unavailable
        run: |
          set -euo pipefail
          test -n "${WINDOPS_CARE_REAL_ARTIFACT_ROOT}"
          test -n "${WINDOPS_CARE_FULL_SCALE_ROOT}"
          test -r "${WINDOPS_CARE_REAL_ARTIFACT_ROOT}/contract/manifest.json"
          test -r "${WINDOPS_CARE_REAL_ARTIFACT_ROOT}/quality/quality-contract.json"
          test -r "${WINDOPS_CARE_REAL_ARTIFACT_ROOT}/minimal-import/care/v6/reports/a-minimal-import/manifest.json"
          test -r "${WINDOPS_CARE_REAL_ARTIFACT_ROOT}/offline-evaluation/care/v6/reports/offline-evaluation/manifest.json"
          test -r "${WINDOPS_CARE_FULL_SCALE_ROOT}/care/v6/reports/full-import/manifest.json"
          test -r "${WINDOPS_CARE_FULL_SCALE_ROOT}/care/v6/reports/full-evaluation/manifest.json"
      - name: Verify locked CARE imports and CLI entrypoints
        run: >-
          windops-care-dependency-closure
          --requirements-lock requirements.container.txt
          --uv-lock uv.lock
          --report care-postgres-evidence/dependency-closure.json
      - name: Create three isolated migrated CARE databases
        run: |
          set -euo pipefail
          for database in windops_care_offline windops_care_full_scale windops_care_vertical; do
            createdb --template=template0 "${database}"
            WINDOPS_DATABASE_URL="postgresql+asyncpg://windops:windops-care-contract@localhost:5432/${database}" \
              alembic upgrade head
          done
      - name: Run the explicit offline CARE PostgreSQL contract
        env:
          WINDOPS_POSTGRES_TEST_URL: postgresql+asyncpg://windops:windops-care-contract@localhost:5432/windops_care_offline
        run: >-
          python -m pytest
          tests/external/test_postgres_care_offline_evaluation.py
          -m external_release
          --junitxml=care-postgres-evidence/offline-junit.xml
          -q
      - name: Run the explicit full-scale CARE PostgreSQL and performance contract
        env:
          WINDOPS_POSTGRES_TEST_URL: postgresql+asyncpg://windops:windops-care-contract@localhost:5432/windops_care_full_scale
        run: >-
          python -m pytest
          tests/external/test_postgres_care_fullscale.py
          -m external_release
          --junitxml=care-postgres-evidence/full-scale-junit.xml
          -q
      - name: Run the explicit same-database CARE vertical and stage-upgrade contracts
        env:
          WINDOPS_POSTGRES_TEST_URL: postgresql+asyncpg://windops:windops-care-contract@localhost:5432/windops_care_vertical
        run: >-
          python -m pytest
          tests/external/test_postgres_care_vertical_slice.py
          -m external_release
          --junitxml=care-postgres-evidence/vertical-junit.xml
          -q
      - name: Verify exact test count, zero skips, roots, performance, and identities
        run: |
          set -euo pipefail
          migration_head="$(alembic heads | awk '{print $1}')"
          test "${migration_head}" = "0028_read_audit_pipeline"
          for database in windops_care_offline windops_care_full_scale windops_care_vertical; do
            WINDOPS_DATABASE_URL="postgresql+asyncpg://windops:windops-care-contract@localhost:5432/${database}" \
              alembic current | grep -F "${migration_head} (head)"
          done
          windops-care-postgres-evidence \
            --offline-junit care-postgres-evidence/offline-junit.xml \
            --full-scale-junit care-postgres-evidence/full-scale-junit.xml \
            --vertical-junit care-postgres-evidence/vertical-junit.xml \
            --dependency-closure care-postgres-evidence/dependency-closure.json \
            --expected-commit-sha "${GITHUB_SHA}" \
            --postgres-image "${WINDOPS_POSTGRES_IMAGE}" \
            --migration-head "${migration_head}" \
            --report care-postgres-evidence/care-postgres-release-evidence.json
      - name: Preserve identity-bound CARE PostgreSQL release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: care-postgres-contract-${{ github.sha }}
          path: backend/care-postgres-evidence
          if-no-files-found: error
